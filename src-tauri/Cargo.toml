[package]
name = "orgcompass"
version = "2.4.0"
description = "组织罗盘 OrgCompass - 桌面版 (Tauri)"
authors = ["Max Hou"]
license = "Apache-2.0"
repository = "https://github.com/MaxHou-infinity/orgcompass"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "orgcompass_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
