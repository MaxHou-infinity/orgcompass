name: 构建多平台安装包

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS (Apple Silicon；Intel runner 已被 GitHub 退役)
          - platform: macos-14
            args: '--target aarch64-apple-darwin'
          # Windows
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-14' && 'aarch64-apple-darwin' || '' }}

      - name: Rust 构建缓存
        uses: Swatinem/rust-cache@v2

      - name: 安装前端依赖
        run: npm ci

      - name: 版本一致性校验（v2.3.1 T-12：避免 lockfile/配置漂移发布）
        run: node scripts/check-versions.mjs

      - name: 前端检查（lint + 类型 + 测试）
        run: |
          npm run lint
          npm run typecheck
          npm run test

      - name: 构建并发布安装包
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: '组织罗盘 OrgCompass ${{ github.ref_name }}'
          releaseBody: 'OrgCompass macOS + Windows 安装包（由 GitHub Actions 自动构建）'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
